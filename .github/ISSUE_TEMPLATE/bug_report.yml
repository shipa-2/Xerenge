name: Bug report
description: Something does not work or looks wrong. Read CONTRIBUTING.md first.
body:
  - type: markdown
    attributes:
      value: |
        **The log is required: an issue without burnout.log attached is closed as invalid, without further explanation.** A report without the version and the hardware has to wait for questions first and is looked at many times later. See [CONTRIBUTING.md](https://github.com/shipa-2/Xerenge/blob/main/CONTRIBUTING.md).
  - type: input
    id: version
    attributes:
      label: Build (artifact run or commit), the release it is based on, and the disc
      placeholder: "Actions run #512 (commit 22dad21), based on 0.4.7, European disc"
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System and hardware
      description: OS and version, CPU, GPU and driver version. Android - phone model, chip, Android version, Turnip or not.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened, and how to make it happen again
      description: What you did, what you expected, what happened instead; where in the game; every time or sometimes.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log and settings
      description: |
        Attach burnout.log from a run with the problem (Windows - %LOCALAPPDATA%\xerenge-burnout, Linux - ~/.local/state/xerenge-burnout, macOS - ~/Library/Logs/xerenge-burnout, Android - the installer's Log folder) and xerenge.conf from the install folder. Drag the files here (zip them if GitHub refuses them; no links to file hosts). Required: without the log the issue is closed as invalid.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: For anything visual.
