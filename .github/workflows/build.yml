name: Build

# Builds the whole game, the way re:Blue's CI does: the three files the build
# needs from the disc (default.xex and the two shader templates) come from the
# private shipa-2/xerenge-assets repository, read with the ASSETS_TOKEN secret.
# What is kept is the compiled game and the installer that installs it - never
# the disc files, generated/ or the translated shader sources.
#
# The payload the installer carries:
#   bin/     the game and the libraries beside it
#   tools/   extract-image, which checks and unpacks the player's disc image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v6

      - name: Install clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build dependencies
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config git curl unzip zip autoconf \
            vulkan-sdk \
            libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxss-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            qt6-base-dev qt6-base-dev-tools qt6-wayland qt6-wayland-dev libfuse2t64

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: linux-amd64

      - name: Fetch the build inputs (private)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::ASSETS_TOKEN is not set"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/shipa-2/xerenge-assets.git" "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" remote set-url origin https://github.com/shipa-2/xerenge-assets.git
          ls -la "$RUNNER_TEMP/assets/game" "$RUNNER_TEMP/assets/game/graphics"

      - name: SDK
        run: ./scripts/setup-sdk.sh

      - name: plume and XenosRecomp
        run: ./scripts/setup-deps.sh

      - name: Build the game
        run: ./scripts/build.sh --game "$RUNNER_TEMP/assets/game"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Payload
        run: |
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload/bin" "$payload/tools"
          cp rexglue/build/burnout "$payload/bin/"
          find rexglue/build rexglue-sdk/out/linux-amd64 -maxdepth 2 -name '*.so*' -not -path '*/Debug/*' -exec cp -a {} "$payload/bin/" \;
          cp tools/bin/extract-image "$payload/tools/"
          ls -laR "$payload"

      - name: Installer AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          cd "$RUNNER_TEMP/linuxdeploy"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          cd "$GITHUB_WORKSPACE"
          XERENGE_PAYLOAD="$RUNNER_TEMP/payload" QMAKE=$(command -v qmake6) ./rexglue/installer/make-appimage.sh
          ls -la rexglue/installer/*.AppImage

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-installer-linux-amd64
          path: rexglue/installer/Burnout_Revenge_Installer-x86_64.AppImage
          retention-days: 7
          if-no-files-found: error

  # The same scripts, run by Git for Windows' bash; scripts/platform.sh picks
  # the win-amd64 preset and the .exe names.
  win-amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM, CMake, Ninja
        shell: pwsh
        run: choco install llvm cmake ninja -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: win-amd64

      - name: Fetch the build inputs (private)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::ASSETS_TOKEN is not set"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/shipa-2/xerenge-assets.git" ../xerenge-assets
          git -C ../xerenge-assets remote set-url origin https://github.com/shipa-2/xerenge-assets.git
          ls -la ../xerenge-assets/game ../xerenge-assets/game/graphics

      - name: SDK
        run: ./scripts/setup-sdk.sh

      - name: plume and XenosRecomp
        run: ./scripts/setup-deps.sh

      - name: Build the game
        run: ./scripts/build.sh --game ../xerenge-assets/game

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Installer
        run: |
          cmake -S rexglue/installer -B rexglue/installer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build rexglue/installer/build

      - name: Package
        run: |
          package="$(cygpath -u "$RUNNER_TEMP")/package"
          payload="$package/payload"
          mkdir -p "$payload/bin" "$payload/tools"
          cp rexglue/build/burnout.exe "$payload/bin/"
          find rexglue/build rexglue-sdk/out/win-amd64 -maxdepth 2 -name '*.dll' -not -path '*/Debug/*' -exec cp {} "$payload/bin/" \;
          cp tools/bin/extract-image.exe "$payload/tools/"
          cp rexglue/installer/build/xerenge-installer.exe "$package/"
          windeployqt --release --no-translations "$package/xerenge-installer.exe"
          ls -laR "$package"

      # One .exe: an Inno Setup wrapper that unpacks the package to a
      # temporary folder and runs the installer from it.
      - name: Installer .exe
        run: |
          # The runner image has Inno Setup; installed only if it ever goes.
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup -y --no-progress
          # -D/-O rather than /D and /O, which Git's bash would take for paths.
          "$iscc" "-DPackage=$(cygpath -w "$RUNNER_TEMP/package")" "-DVersion=$(tr -d '[:space:]' < VERSION)" \
            "-O$(cygpath -w "$RUNNER_TEMP/setup")" rexglue/installer/windows-setup.iss
          ls -la "$RUNNER_TEMP/setup"

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-installer-win-amd64
          path: ${{ runner.temp }}/setup/Burnout_Revenge_Installer-win-amd64.exe
          retention-days: 7
          if-no-files-found: error

  # Android (arm64, a phone with an Adreno GPU): the code and the shaders are
  # generated on the runner as for Linux, then the game is cross-built with the
  # NDK and packed into an APK by scripts/build-android-apk.sh (no Gradle). The
  # APK is signed with the ANDROID_KEYSTORE_B64 secret (a base64 keystore, alias
  # xerenge, password android) when it is set, so it installs over the last one;
  # without it a key made for this run signs it, and an installed copy has to be
  # removed first.
  android-arm64:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v6

      - name: libadrenotools
        run: git submodule update --init --recursive --depth 1 rexglue/android/thirdparty/libadrenotools

      - name: Install clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build dependencies
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config git curl unzip zip autoconf \
            vulkan-sdk \
            libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxss-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: android-arm64

      - name: Fetch the build inputs (private)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::ASSETS_TOKEN is not set"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/shipa-2/xerenge-assets.git" "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" remote set-url origin https://github.com/shipa-2/xerenge-assets.git

      - name: SDK
        run: ./scripts/setup-sdk.sh

      - name: plume and XenosRecomp
        run: ./scripts/setup-deps.sh

      - name: Generate the code and the shaders
        run: ./scripts/build.sh --game "$RUNNER_TEMP/assets/game" --generate-only

      - name: Build for Android
        run: |
          cmake -S rexglue -B rexglue/build-android -G Ninja \
            -DREXSDK_DIR="$PWD/rexglue-sdk" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
            -DREXGLUE_ARM64_MARCH=armv8.2-a -DCMAKE_C_FLAGS=-march=armv8.2-a -DCMAKE_CXX_FLAGS=-march=armv8.2-a \
            -DREXGLUE_CODEGEN="$PWD/rexglue-sdk/out/linux-amd64/Release/rexglue"
          cmake --build rexglue/build-android -j"$(nproc)"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.android/xerenge-debug.keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this APK is signed with a key of its own and will not install over an earlier one"
          fi
          ./scripts/build-android-apk.sh
          mkdir -p "$RUNNER_TEMP/apk"
          cp rexglue/build-android/burnout.apk "$RUNNER_TEMP/apk/Burnout_Revenge-android-arm64.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-android-arm64
          path: ${{ runner.temp }}/apk/Burnout_Revenge-android-arm64.apk
          retention-days: 7
          if-no-files-found: error

  # The lobby server for a self-hosted online game (rexglue/lobby.sh builds the
  # same thing by hand): three source files and no dependencies, so it needs
  # neither the private build inputs nor the game. One artifact carries the
  # Linux and the Windows build.
  lobby-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix

      - name: Build
        run: |
          sources="rexglue/tools/ealobby/main.cpp rexglue/src/ealobby/aries.cpp rexglue/src/ealobby/server.cpp"
          mkdir -p out
          g++ -std=c++17 -O2 -pthread -Irexglue/src -static-libstdc++ -static-libgcc $sources \
            -o out/ealobby-linux-amd64
          x86_64-w64-mingw32-g++-posix -std=c++17 -O2 -static -Irexglue/src $sources -lws2_32 \
            -o out/ealobby-win-amd64.exe
          cat > out/README.txt <<'EOF'
          A lobby server for Burnout Revenge's online mode, standing in for EA's.

            ealobby-linux-amd64 [--host A] [--directory-port P] [--lobby-port P] [--advertise A]
            ealobby-win-amd64.exe  (the same options)

          TCP ports 31860 and 31861 must be reachable. Players start the game with
          `./run.sh --lobby-server=<address of this machine>` (see SETUP.md).
          EOF
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-lobby-server
          path: out/
          retention-days: 7
          if-no-files-found: error

  # A release when VERSION names one that does not exist yet: a push to main
  # that raises VERSION publishes the installers and the lobby server as the
  # latest release.
  release:
    needs: [linux-amd64, win-amd64, android-arm64, lobby-server]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v6
        if: steps.version.outputs.new == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -la artifacts
          cat > notes.md <<'EOF'
          The game comes built: the installer only needs your own Burnout Revenge disc image (PAL, see `SETUP.md`).

          **Windows:** download `Burnout_Revenge_Installer-win-amd64.exe` and run it.

          **Linux:** download `Burnout_Revenge_Installer-x86_64.AppImage`, then
          ```bash
          chmod +x Burnout_Revenge_Installer-x86_64.AppImage
          ./Burnout_Revenge_Installer-x86_64.AppImage
          ```

          Run the installer again over an installed copy to update it; your settings are kept.

          **Android** (arm64, Adreno GPU): install `Burnout_Revenge-android-arm64.apk`. It opens as the installer: pick your disc image, and on a phone whose stock driver is older than Vulkan 1.2 load a Mesa Turnip driver .zip as well.

          **Your own online server:** `ealobby-linux-amd64` or `ealobby-win-amd64.exe` is a lobby server for the online mode. Run it on a machine whose TCP ports 31860 and 31861 the players can reach, and start each game with `--lobby-server=<that machine>`. Without it, the copies on one LAN find each other's games with no server at all.
          EOF
          gh release create "v$VERSION" --title "$VERSION" --latest --target "$GITHUB_SHA" \
            --notes-file notes.md \
            artifacts/Burnout_Revenge_Installer-x86_64.AppImage \
            artifacts/Burnout_Revenge_Installer-win-amd64.exe \
            artifacts/Burnout_Revenge-android-arm64.apk \
            artifacts/ealobby-linux-amd64 \
            artifacts/ealobby-win-amd64.exe
