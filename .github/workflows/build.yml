name: Build

# Builds the whole game, the way re:Blue's CI does: the three files the build
# needs from the disc (default.xex and the two shader templates) come from the
# private shipa-2/xerenge-assets repository, read with the ASSETS_TOKEN secret.
# What is kept is the compiled game and the installer that installs it - never
# the disc files, generated/ or the translated shader sources.
#
# The payload the installer carries:
#   bin/     the game and the libraries beside it: burnout_eu, built from the
#            European release's default.xex (the assets' game_eu/), and
#            burnout_us from the American one's (game_us/, when the assets
#            carry it); the installer installs the one for the disc as burnout
#   tools/   extract-image, which checks and unpacks the player's disc image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: Run only this job (a manual dispatch only; a push always builds everything)
        type: choice
        options: [all, linux-amd64, win-amd64, android-arm64, macos-arm64, lobby-server, mods]
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'linux-amd64'
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v6

      - name: etcpak
        run: git submodule update --init --depth 1 rexglue/thirdparty/etcpak

      - name: Install clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build dependencies
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config git curl unzip zip autoconf \
            vulkan-sdk \
            libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxss-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            qt6-base-dev qt6-base-dev-tools qt6-wayland qt6-wayland-dev libfuse2t64

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: linux-amd64

      - name: Fetch the build inputs (private)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::ASSETS_TOKEN is not set"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/shipa-2/xerenge-assets.git" "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" remote set-url origin https://github.com/shipa-2/xerenge-assets.git
          # Older assets keep the European files in game/ rather than game_eu/.
          [ -d "$RUNNER_TEMP/assets/game_eu" ] || mv "$RUNNER_TEMP/assets/game" "$RUNNER_TEMP/assets/game_eu"
          ls -la "$RUNNER_TEMP/assets/game_eu" "$RUNNER_TEMP/assets/game_eu/graphics"

      # The SDK, plume and XenosRecomp are separate forks that rarely change
      # between runs; cached by their current commit, so an unchanged fork
      # is a cache restore (seconds) rather than a full clone and rebuild
      # (minutes) - CMake and Ninja still see everything up to date and do
      # nothing further, which is why the scripts below are unchanged.
      - name: Resolve SDK/plume/XenosRecomp commits
        id: pins
        run: |
          echo "sdk=$(git ls-remote https://github.com/shipa-2/rexglue-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "plume=$(git ls-remote https://github.com/shipa-2/plume-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "xenos=$(git ls-remote https://github.com/shipa-2/XenosRecomp-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache the SDK checkout and build
        uses: actions/cache@v4
        with:
          path: rexglue-sdk
          key: sdk-linux-amd64-${{ steps.pins.outputs.sdk }}

      - name: SDK
        run: ./scripts/setup-sdk.sh

      - name: Cache plume and XenosRecomp
        uses: actions/cache@v4
        with:
          path: |
            plume
            XenosRecomp
          key: deps-linux-amd64-${{ steps.pins.outputs.plume }}-${{ steps.pins.outputs.xenos }}

      - name: plume and XenosRecomp
        run: ./scripts/setup-deps.sh

      - name: Build the game
        run: ./scripts/build.sh --game "$RUNNER_TEMP/assets/game_eu"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Payload
        run: |
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload/bin" "$payload/tools"
          cp rexglue/build/burnout "$payload/bin/burnout_eu"
          find rexglue/build rexglue-sdk/out/linux-amd64 -maxdepth 2 -name '*.so*' -not -path '*/Debug/*' -exec cp -a {} "$payload/bin/" \;
          cp rexglue/plume_pipelines.txt "$payload/bin/"  # the pipelines met playing it through: made during the logos
          # The launcher (launcher.cpp), beside the game once installed.
          c++ -std=c++17 -O2 rexglue/installer/launcher.cpp -o "$payload/burnout_revenge"
          cp tools/bin/extract-image "$payload/tools/"
          ls -laR "$payload"

      # The American release: its code lies where the European one's does, but
      # the territory it was built for is compiled into it, so it is generated
      # and built again from its own default.xex, into the payload as bin/burnout_us
      # (the installer takes it for that disc; the libraries are the same for
      # both). Built when the assets carry game_us/.
      - name: Build the game for the American release
        run: |
          if [ ! -f "$RUNNER_TEMP/assets/game_us/default.xex" ]; then
            echo "::warning::the assets have no game_us/: this installer carries the European build only"
            exit 0
          fi
          ./scripts/build.sh --game "$RUNNER_TEMP/assets/game_us"
          cp rexglue/build/burnout "$RUNNER_TEMP/payload/bin/burnout_us"

      - name: Installer AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          cd "$RUNNER_TEMP/linuxdeploy"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          cd "$GITHUB_WORKSPACE"
          XERENGE_PAYLOAD="$RUNNER_TEMP/payload" QMAKE=$(command -v qmake6) ./rexglue/installer/make-appimage.sh
          ls -la rexglue/installer/*.AppImage

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-installer-linux-amd64
          path: rexglue/installer/Burnout_Revenge_Installer-x86_64.AppImage
          retention-days: 7
          if-no-files-found: error

  # The same scripts, run by Git for Windows' bash; scripts/platform.sh picks
  # the win-amd64 preset and the .exe names.
  win-amd64:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'win-amd64'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v6

      - name: etcpak
        run: git submodule update --init --depth 1 rexglue/thirdparty/etcpak

      - name: Install LLVM, CMake, Ninja
        shell: pwsh
        # The runner image has them all; Chocolatey only for one that is missing
        # (its feed is down at times, and then even an installed package fails).
        run: |
          $missing = @(@{llvm = "clang"; cmake = "cmake"; ninja = "ninja"}.GetEnumerator() |
            Where-Object { -not (Get-Command $_.Value -ErrorAction SilentlyContinue) } | ForEach-Object { $_.Key })
          if ($missing) { choco install @missing -y }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - name: Exclude the workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: win-amd64

      - name: Fetch the build inputs (private)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::ASSETS_TOKEN is not set"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/shipa-2/xerenge-assets.git" ../xerenge-assets
          git -C ../xerenge-assets remote set-url origin https://github.com/shipa-2/xerenge-assets.git
          [ -d ../xerenge-assets/game_eu ] || mv ../xerenge-assets/game ../xerenge-assets/game_eu
          ls -la ../xerenge-assets/game_eu ../xerenge-assets/game_eu/graphics

      # See the matching step in linux-amd64 for why: an unchanged fork
      # restores from cache instead of a full clone and rebuild.
      - name: Resolve SDK/plume/XenosRecomp commits
        id: pins
        run: |
          echo "sdk=$(git ls-remote https://github.com/shipa-2/rexglue-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "plume=$(git ls-remote https://github.com/shipa-2/plume-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "xenos=$(git ls-remote https://github.com/shipa-2/XenosRecomp-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          # The runner image: a new one brings a new MSVC, and the precompiled headers of a build made with the old one no longer load.
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"

      - name: Cache the SDK checkout and build
        uses: actions/cache@v4
        with:
          path: rexglue-sdk
          key: sdk-win-amd64-${{ steps.pins.outputs.image }}-${{ steps.pins.outputs.sdk }}

      - name: SDK
        run: ./scripts/setup-sdk.sh

      - name: Cache plume and XenosRecomp
        uses: actions/cache@v4
        with:
          path: |
            plume
            XenosRecomp
          key: deps-win-amd64-${{ steps.pins.outputs.image }}-${{ steps.pins.outputs.plume }}-${{ steps.pins.outputs.xenos }}

      - name: plume and XenosRecomp
        run: ./scripts/setup-deps.sh

      - name: Build the game
        run: ./scripts/build.sh --game ../xerenge-assets/game_eu

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Installer
        run: |
          cmake -S rexglue/installer -B rexglue/installer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build rexglue/installer/build

      - name: Package
        run: |
          package="$(cygpath -u "$RUNNER_TEMP")/package"
          payload="$package/payload"
          mkdir -p "$payload/bin" "$payload/tools"
          cp rexglue/build/burnout.exe "$payload/bin/burnout_eu.exe"
          find rexglue/build rexglue-sdk/out/win-amd64 -maxdepth 2 -name '*.dll' -not -path '*/Debug/*' -exec cp {} "$payload/bin/" \;
          cp rexglue/plume_pipelines.txt "$payload/bin/"  # the pipelines met playing it through: made during the logos
          cp tools/bin/extract-image.exe "$payload/tools/"
          cp "rexglue/installer/build/Burnout Revenge.exe" "$payload/"
          cp rexglue/installer/build/xerenge-installer.exe "$package/"
          windeployqt --release --no-translations "$package/xerenge-installer.exe"
          ls -laR "$package"

      # The American release: its code lies where the European one's does, but
      # the territory it was built for is compiled into it, so it is generated
      # and built again from its own default.xex, into the payload as bin/burnout_us
      # (the installer takes it for that disc; the libraries are the same for
      # both). Built when the assets carry game_us/.
      - name: Build the game for the American release
        run: |
          if [ ! -f "../xerenge-assets/game_us/default.xex" ]; then
            echo "::warning::the assets have no game_us/: this installer carries the European build only"
            exit 0
          fi
          ./scripts/build.sh --game "../xerenge-assets/game_us"
          cp rexglue/build/burnout.exe "$(cygpath -u "$RUNNER_TEMP")/package/payload/bin/burnout_us.exe"

      # One .exe: an Inno Setup wrapper that unpacks the package to a
      # temporary folder and runs the installer from it.
      - name: Installer .exe
        run: |
          # The runner image has Inno Setup; installed only if it ever goes.
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup -y --no-progress
          # -D/-O rather than /D and /O, which Git's bash would take for paths.
          "$iscc" "-DPackage=$(cygpath -w "$RUNNER_TEMP/package")" "-DVersion=$(tr -d '[:space:]' < VERSION)" \
            "-O$(cygpath -w "$RUNNER_TEMP/setup")" rexglue/installer/windows-setup.iss
          ls -la "$RUNNER_TEMP/setup"

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-installer-win-amd64
          path: ${{ runner.temp }}/setup/Burnout_Revenge_Installer-win-amd64.exe
          retention-days: 7
          if-no-files-found: error

  # Android (arm64, a phone with an Adreno GPU): the code and the shaders are
  # generated on the runner as for Linux, then the game is cross-built with the
  # NDK and packed into an APK by scripts/build-android-apk.sh (no Gradle). The
  # APK is signed with the ANDROID_KEYSTORE_B64 secret (a base64 keystore, alias
  # xerenge, password android) when it is set, so it installs over the last one;
  # without it a key made for this run signs it, and an installed copy has to be
  # removed first.
  android-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'android-arm64'
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v6

      - name: libadrenotools and etcpak
        run: git submodule update --init --recursive --depth 1 rexglue/android/thirdparty/libadrenotools rexglue/thirdparty/etcpak

      - name: Install clang 20
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build dependencies
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config git curl unzip zip autoconf \
            vulkan-sdk \
            libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxss-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: android-arm64

      - name: Fetch the build inputs (private)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::ASSETS_TOKEN is not set"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/shipa-2/xerenge-assets.git" "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" remote set-url origin https://github.com/shipa-2/xerenge-assets.git
          # Older assets keep the European files in game/ rather than game_eu/.
          [ -d "$RUNNER_TEMP/assets/game_eu" ] || mv "$RUNNER_TEMP/assets/game" "$RUNNER_TEMP/assets/game_eu"

      # See the matching step in linux-amd64 for why: an unchanged fork
      # restores from cache instead of a full clone and rebuild.
      - name: Resolve SDK/plume/XenosRecomp commits
        id: pins
        run: |
          echo "sdk=$(git ls-remote https://github.com/shipa-2/rexglue-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "plume=$(git ls-remote https://github.com/shipa-2/plume-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "xenos=$(git ls-remote https://github.com/shipa-2/XenosRecomp-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache the SDK checkout and build
        uses: actions/cache@v4
        with:
          path: rexglue-sdk
          key: sdk-android-arm64-${{ steps.pins.outputs.sdk }}

      - name: SDK
        run: ./scripts/setup-sdk.sh

      - name: Cache plume and XenosRecomp
        uses: actions/cache@v4
        with:
          path: |
            plume
            XenosRecomp
          key: deps-android-arm64-${{ steps.pins.outputs.plume }}-${{ steps.pins.outputs.xenos }}

      - name: plume and XenosRecomp
        run: ./scripts/setup-deps.sh

      - name: Generate the code and the shaders
        run: ./scripts/build.sh --game "$RUNNER_TEMP/assets/game_eu" --generate-only

      - name: Build for Android
        run: |
          cmake -S rexglue -B rexglue/build-android -G Ninja \
            -DREXSDK_DIR="$PWD/rexglue-sdk" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
            -DREXGLUE_ARM64_MARCH=armv8-a "-DCMAKE_C_FLAGS=-march=armv8-a -moutline-atomics" "-DCMAKE_CXX_FLAGS=-march=armv8-a -moutline-atomics" \
            -DREXGLUE_CODEGEN="$PWD/rexglue-sdk/out/linux-amd64/Release/rexglue"
          cmake --build rexglue/build-android -j"$(nproc)"

      # The American release, as in linux-amd64: generated again from its own
      # default.xex and built as libmain_us.so, which build-android-apk.sh
      # packs beside libmain_eu.so. Built when the assets carry game_us/.
      - name: Build for Android, the American release
        run: |
          if [ ! -f "$RUNNER_TEMP/assets/game_us/default.xex" ]; then
            echo "::warning::the assets have no game_us/: this APK carries the European build only"
            exit 0
          fi
          ./scripts/build.sh --game "$RUNNER_TEMP/assets/game_us" --generate-only
          cmake -S rexglue -B rexglue/build-android-us -G Ninja \
            -DREXSDK_DIR="$PWD/rexglue-sdk" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
            -DREXGLUE_ARM64_MARCH=armv8-a "-DCMAKE_C_FLAGS=-march=armv8-a -moutline-atomics" "-DCMAKE_CXX_FLAGS=-march=armv8-a -moutline-atomics" \
            -DREXGLUE_CODEGEN="$PWD/rexglue-sdk/out/linux-amd64/Release/rexglue" \
            -DBURNOUT_ANDROID_LIBRARY=main_us
          cmake --build rexglue/build-android-us -j"$(nproc)" --target burnout

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.android/xerenge-debug.keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this APK is signed with a key of its own and will not install over an earlier one"
          fi
          ./scripts/build-android-apk.sh
          mkdir -p "$RUNNER_TEMP/apk"
          cp rexglue/build-android/burnout.apk "$RUNNER_TEMP/apk/Burnout_Revenge-android-arm64.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-android-arm64
          path: ${{ runner.temp }}/apk/Burnout_Revenge-android-arm64.apk
          retention-days: 7
          if-no-files-found: error

  # macOS, Apple silicon: the SDK builds its own Vulkan loader and MoltenVK
  # and stages them beside the game, so Homebrew only supplies the build
  # tools and Qt for the installer, no Vulkan or windowing packages. Intel
  # Macs are not built: that build never worked.
  macos-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'macos-arm64'
    # macos-14's default Xcode is 15.x (AppleClang 15); the SDK needs AppleClang
    # 16+ (Xcode 16+) for C++23. macos-15 defaults to a new enough Xcode.
    runs-on: macos-15
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v6

      - name: etcpak
        run: git submodule update --init --depth 1 rexglue/thirdparty/etcpak

      - name: Install build dependencies
        run: brew install cmake ninja pkgconf qt

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: macos-arm64

      - name: Fetch the build inputs (private)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::ASSETS_TOKEN is not set"; exit 1
          fi
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/shipa-2/xerenge-assets.git" "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" remote set-url origin https://github.com/shipa-2/xerenge-assets.git
          # Older assets keep the European files in game/ rather than game_eu/.
          [ -d "$RUNNER_TEMP/assets/game_eu" ] || mv "$RUNNER_TEMP/assets/game" "$RUNNER_TEMP/assets/game_eu"
          ls -la "$RUNNER_TEMP/assets/game_eu" "$RUNNER_TEMP/assets/game_eu/graphics"

      # See the matching step in linux-amd64 for why: an unchanged fork
      # restores from cache instead of a full clone and rebuild.
      - name: Resolve SDK/plume/XenosRecomp commits
        id: pins
        run: |
          echo "sdk=$(git ls-remote https://github.com/shipa-2/rexglue-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "plume=$(git ls-remote https://github.com/shipa-2/plume-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "xenos=$(git ls-remote https://github.com/shipa-2/XenosRecomp-xerenge.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache the SDK checkout and build
        uses: actions/cache@v4
        with:
          path: rexglue-sdk
          key: sdk-macos-arm64-${{ steps.pins.outputs.sdk }}

      - name: SDK
        run: ./scripts/setup-sdk.sh

      - name: Cache plume and XenosRecomp
        uses: actions/cache@v4
        with:
          path: |
            plume
            XenosRecomp
          key: deps-macos-arm64-${{ steps.pins.outputs.plume }}-${{ steps.pins.outputs.xenos }}

      - name: plume and XenosRecomp
        run: ./scripts/setup-deps.sh

      - name: Build the game
        run: ./scripts/build.sh --game "$RUNNER_TEMP/assets/game_eu"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Payload
        run: |
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload/bin" "$payload/tools"
          cp rexglue/build/burnout "$payload/bin/burnout_eu"
          find rexglue/build rexglue-sdk/out/mac-arm64 -maxdepth 2 -name '*.dylib' -not -path '*/Debug/*' -exec cp -a {} "$payload/bin/" \;
          cp rexglue/plume_pipelines.txt "$payload/bin/"  # the pipelines met playing it through: made during the logos
          cp -R rexglue/build/vulkan "$payload/bin/vulkan"
          # The launcher (launcher.cpp), beside the game once installed.
          c++ -std=c++17 -O2 rexglue/installer/launcher.cpp -o "$payload/burnout_revenge"
          cp tools/bin/extract-image "$payload/tools/"
          ls -laR "$payload"

      # The American release: its code lies where the European one's does, but
      # the territory it was built for is compiled into it, so it is generated
      # and built again from its own default.xex, into the payload as bin/burnout_us
      # (the installer takes it for that disc; the libraries are the same for
      # both). Built when the assets carry game_us/.
      - name: Build the game for the American release
        run: |
          if [ ! -f "$RUNNER_TEMP/assets/game_us/default.xex" ]; then
            echo "::warning::the assets have no game_us/: this installer carries the European build only"
            exit 0
          fi
          ./scripts/build.sh --game "$RUNNER_TEMP/assets/game_us"
          cp rexglue/build/burnout "$RUNNER_TEMP/payload/bin/burnout_us"

      - name: Installer app
        run: |
          XERENGE_PAYLOAD="$RUNNER_TEMP/payload" ./rexglue/installer/make-macos-app.sh
          ls -la rexglue/installer/*.zip

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-installer-macos-arm64
          path: rexglue/installer/Burnout_Revenge_Installer-macos-arm64.zip
          retention-days: 7
          if-no-files-found: error

  # The lobby server for a self-hosted online game (rexglue/lobby.sh builds the
  # same thing by hand): three source files and no dependencies, so it needs
  # neither the private build inputs nor the game. One artifact carries the
  # Linux and the Windows build.
  lobby-server:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'lobby-server'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix

      - name: Build
        run: |
          sources="rexglue/tools/ealobby/main.cpp rexglue/src/ealobby/aries.cpp rexglue/src/ealobby/locker.cpp rexglue/src/ealobby/news.cpp rexglue/src/ealobby/server.cpp"
          mkdir -p out
          g++ -std=c++17 -O2 -pthread -Irexglue/src -static-libstdc++ -static-libgcc $sources \
            -o out/ealobby-linux-amd64
          x86_64-w64-mingw32-g++-posix -std=c++17 -O2 -static -Irexglue/src $sources -lws2_32 \
            -o out/ealobby-win-amd64.exe
          cat > out/README.txt <<'EOF'
          A lobby server for Burnout Revenge's online mode, standing in for EA's.

            ealobby-linux-amd64 [--host A] [--directory-port P] [--lobby-port P] [--advertise A] [--locker-port P] [--locker-dir D]
            ealobby-win-amd64.exe  (the same options)

          TCP ports 31860 and 31861 must be reachable. Players start the game with
          `./run.sh --lobby-server=<address of this machine>` (see SETUP.md).
          EOF
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-lobby-server
          path: out/
          retention-days: 7
          if-no-files-found: error

  # The mods kept in rexglue/mods, each a zip of its folder - unzipped into the
  # installed game's game/mods/ (MODDING.md). Only text: what they need of the
  # game (a localisation's fonts) is made from the player's own copy.
  mods:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'mods'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Zip
        run: |
          mkdir -p out
          cd rexglue/mods
          for mod in */; do
            mod=${mod%/}
            [ -f "$mod/mod.cfg" ] || continue
            zip -r "../../out/Xerenge-mod-$mod.zip" "$mod" -x "$mod/.cache/*"
          done
          ls -la ../../out

      - uses: actions/upload-artifact@v6
        with:
          name: burnout-revenge-mods
          path: out/
          retention-days: 7
          if-no-files-found: error

  # A release when VERSION names one that does not exist yet: a push to main
  # that raises VERSION publishes the installers as the
  # latest release.
  release:
    needs: [linux-amd64, win-amd64, android-arm64, macos-arm64, lobby-server, mods]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v6
        if: steps.version.outputs.new == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -la artifacts
          cat > notes.md <<'EOF'
          The game comes built: the installer only needs your own Burnout Revenge disc image (the European or the American release, see `SETUP.md`).

          **Windows:** download `Burnout_Revenge_Installer-win-amd64.exe` and run it.

          **Linux:** download `Burnout_Revenge_Installer-x86_64.AppImage`, then
          ```bash
          chmod +x Burnout_Revenge_Installer-x86_64.AppImage
          ./Burnout_Revenge_Installer-x86_64.AppImage
          ```

          Run the installer again over an installed copy to update it; your settings are kept.

          **Android** (arm64, Adreno or Mali): install `Burnout_Revenge-android-arm64.apk`. It opens as the installer: pick your disc image. A Mesa Turnip driver .zip is optional, for Adreno phones whose own driver misbehaves. This release is signed with a fixed key: uninstall an earlier build once, and later ones install over it, keeping your saves.

          **macOS** (Apple silicon): download `Burnout_Revenge_Installer-macos-arm64.zip`, unzip it and run the app inside. It puts `Burnout Revenge.app` in `~/Applications`, so the game starts from Launchpad or Spotlight. The app is signed ad hoc, so macOS stops it the first time it is opened after a download; allow it under System Settings, Privacy & Security, Open Anyway. The installed game logs to `~/Library/Logs/xerenge-burnout/`.

          **Russian** (a mod): unzip `Xerenge-mod-locale_rus.zip` into the installed game's `game/mods/` and choose RUSSIAN in Driver Details > Settings > LANGUAGE. Its fonts are made at the first start from your own copy of the game; see `MODDING.md` to translate further or make a mod of your own.

          **Online play works out of the box** - the installer points at the server (`94639.snk.wtf`), where everyone plays together; there is nothing to set up. An install from before the server is moved to it when the installer runs over it.

          **What's new in 0.4.9:**
          - **Wide screens**: on a screen wider than 16:9 the race HUD goes to the screen's edges, the crash border and flashes cover the whole frame, and the menus' background videos fill the width (`menu_video` = zoom, stretch or box in `xerenge.conf`). Keep 16:9 turns it off. By GOATS2K (GitHub #53).
          - **Your own music**: Driver Details > Song Manager, LT switches EA Trax for the songs of a `music` folder beside the game (MP3 and WMA, names from their tags), RT sets their order. The folder is read again each time EA Trax is opened.
          - **Mods**: translations into languages the game was never released in, with fonts of their own - see `MODDING.md`. The installer makes `game/mods`; the Russian mod comes with the release.
          - **Saves from Xenia and from a console**: a Xenia profile folder put beside the game's saves, or a save package in `import/`, is taken in at the first start (GitHub #46).
          - **Button icons**: Driver Details > Settings > BUTTON ICONS - XBOX (the game's own) or PLAYSTATION.
          - **Achievements**: a notice as one is earned, and the full list under Player File > Stats.
          - **Online**: players on the internet reach each other through their routers (NAT traversal, GitHub #49); quick match finds only games of the kind asked for, Ranked or Player Match (GitHub #35).
          - **Phones with a Mali GPU**: textures are re-encoded for the GPU on all cores, and the first start prepares them in the background, so tracks and menus load without stalls (GitHub #32).
          - **Portable**: a box in the installer keeps the saves, caches and logs in the game's folder (GitHub #42).
          - **Linux**: runs natively on Wayland in a Wayland session.
          - **Smoother starts**: shader pipelines are made ahead and the driver's compiled ones kept between runs.
          - **Installer**: says why a copy failed and what to do (the game running, Program Files, Controlled folder access), and checks the folder before the long steps (GitHub #59, #65).
          - B on the main menu asks whether to quit the game.

          EOF
          gh release create "v$VERSION" --title "$VERSION" --latest --target "$GITHUB_SHA" \
            --notes-file notes.md \
            artifacts/Burnout_Revenge_Installer-x86_64.AppImage \
            artifacts/Burnout_Revenge_Installer-win-amd64.exe \
            artifacts/Burnout_Revenge-android-arm64.apk \
            artifacts/Burnout_Revenge_Installer-macos-arm64.zip \
            artifacts/Xerenge-mod-*.zip
